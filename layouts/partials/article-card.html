<article class="article-card"><header><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p><time datetime="{{ .Date }}">{{ .Date.Format "Jan 2, 2006" }}</time></p></header>{{ with .Description }}<p>{{ . }}</p>{{ end }}{{ with .Params.series }}<div><b>Series:</b><ul class="inline-list">{{ range . }}<li><a href="/series/{{ . | urlize }}/">{{ . }}</a></li>{{ end }}</ul></div>{{ end }}{{ with .Params.tags }}<div><b>Tags:</b><ul class="inline-list">{{ range . }}<li><a href="/tags/{{ . | urlize }}/">{{ . }}</a></li>{{ end }}</ul></div>{{ end }}</article>
