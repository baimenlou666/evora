<!DOCTYPE html>
<html lang="en">
<head>{{ partial "head.html" . }}</head>
<body>
  {{ partial "nav.html" . }}
  <main class="frame main-frame single-margin">
    <header class="taxonomy-header">
      <h1>{{ .Title }}</h1>
      <span><a href="/{{ .Data.Plural }}/index.xml" class="rss-button"><img src="/assets/icons/rss.png" alt="RSS Button"></a></span>
    </header>
    <div class="taxonomy-list">
      {{ range .Data.Terms.Alphabetical }}
        {{ if or (ne $.Data.Plural "tags") (in (slice "Hugo" "Neocities" "Pai Sho" "Programming") .Page.Title) }}
          <section class="taxonomy"><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a><span>🔢 {{ .Count }}</span></section>
        {{ end }}
      {{ end }}
    </div>
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
