{{ $page := .page }}
<article class="article-card"><header><h2><a href="{{ $page.RelPermalink }}">{{ $page.Title }}</a></h2><p><time datetime="{{ .displayDate }}">{{ .displayDate }}</time></p></header>{{ with $page.Description }}<p>{{ . }}</p>{{ end }}{{ with $page.Params.series }}<div><b>Series:</b><ul class="inline-list">{{ range . }}<li><a href="/series/{{ . | urlize }}/">{{ . }}</a></li>{{ end }}</ul></div>{{ end }}{{ with $page.Params.tags }}<div><b>Tags:</b><ul class="inline-list">{{ range . }}<li><a href="/tags/{{ . | urlize }}/">{{ . }}</a></li>{{ end }}</ul></div>{{ end }}</article>
